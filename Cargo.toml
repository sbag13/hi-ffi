[package]
name = "hi-ffi"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "Procedural macro that automatically generates FFI for C++, Python, Swift, Java, and C#"
repository = "https://github.com/sbag13/hi-ffi"
keywords = ["ffi", "c++", "python", "java", "bindings"]

[lib]
proc-macro = true

[features]
default = []
cpp = []
swift = []
python = []
java = []
c_sharp = []

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0.44"
proc-macro2 = "1.0.86"
