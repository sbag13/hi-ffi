name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run clippy
      run: cargo clippy --all-features
    - name: Build tests crate
      run: cd tests && cargo build
    - name: Run c++ example
      run: cd ./tests/cpp/ && ./test_cpp.sh
    - name: cpp valgrind check
      uses: Ximaz/valgrind-action@v1.2.0
      with:
        binary_path: "./tests/cpp/test"
    - name: Run swift example
      run: cd ./tests/swift/ && ./test_swift.sh
    - name: Run python example
      run: cd ./tests/python && python3 main.py
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Run Java example
      run: cd ./tests/java && bash test_java.sh
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Run C# example
      run: cd ./tests/c_sharp && bash test_c_sharp.sh
